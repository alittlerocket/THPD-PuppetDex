name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # Pinned: WebKitGTK package names changed in 24.04.
        platform: [windows-latest, ubuntu-22.04]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Git on Windows checks the gui/static symlinks out as text files, so
      # they are replaced with real copies here.
      - name: Prepare bundled data
        shell: bash
        run: |
          python3 parser/run_all.py --db-only
          rm -rf gui/static/sprites gui/static/funky-cirno.gif
          cp -r data/sprites gui/static/sprites
          cp data/animations/funky-cirno.gif gui/static/funky-cirno.gif

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libssl-dev build-essential

      - name: Install frontend dependencies
        working-directory: gui
        run: deno install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_name }}
          releaseName: 'Puppetdex ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false

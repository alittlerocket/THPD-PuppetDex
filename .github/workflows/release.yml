name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # tpdp_data.json and the sprites are committed, so this only converts the
      # JSON into SQLite -- no network access. A release must not depend on the
      # wiki being reachable, and re-scraping on every run (including every
      # retried run) would put hundreds of needless requests on a
      # volunteer-run site.
      - name: Build database from committed data
        run: python3 parser/run_all.py --db-only

      # gui/static holds symlinks into data/, which Windows checkouts
      # materialise as plain text files. Replacing them with real copies
      # behaves identically on every runner.
      - name: Stage static assets
        shell: bash
        run: |
          rm -rf gui/static/sprites gui/static/funky-cirno.gif
          cp -r data/sprites gui/static/sprites
          cp data/animations/funky-cirno.gif gui/static/funky-cirno.gif
          test -f data/puppetdex.db || { echo "database was not built"; exit 1; }

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri -> target

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev

      - name: Install frontend dependencies
        working-directory: gui
        run: deno install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tagName: ${{ github.ref_name }}
          releaseName: 'Puppetdex ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

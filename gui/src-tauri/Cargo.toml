[package]
name = "thpd-puppetdex-tauri"
version = "0.2.2"
description = "Desktop puppet lookup and damage calculator for Touhou Puppet Dance Performance"
authors = ["alittlerocket"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's; they
# collide on Windows otherwise. https://github.com/rust-lang/cargo/issues/8519
name = "thpd_puppetdex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

